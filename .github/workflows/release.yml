name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 草稿 release 与上传

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # make deps 是 PowerShell 写的（下载 7z、按 sha256 验包、解出 libmpv），
      # 所以这个 job 跑在 windows-latest 上而不是 ubuntu。ALIVE 只发 Windows，
      # 正好不需要交叉编译。
      - name: Tools
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }

      # libmpv 不入库（116MB），按 Makefile 里的 sha256 取。
      - name: Fetch libmpv
        shell: pwsh
        run: make deps

      - name: Build and upload
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform windows/amd64 -upload