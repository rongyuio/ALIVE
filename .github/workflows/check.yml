# 提交/PR 的全量校验：gofmt + build + vet + mygo vet + test。
#
# 为什么用 windows-latest 而不是 ubuntu：这个项目的运行时就是 Windows
# （界面是 MyGo 的 D3D 后端，播放走 libmpv 的 DLL），在 Linux 上能过只能
# 说明代码能编译，说明不了它能不能跑。CI 跟开发机保持同一平台，
# 本地 `make check` 过了 CI 就该过。
#
# 为什么不用 make：GitHub 的 Windows 镜像不保证装 make，而这几步本来就
# 是几条命令。命令和 Makefile 里的 check 目标一一对应（vet / test 都带
# -tags mock），改 Makefile 时记得同步这里。
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # 全历史：gate 的 churn 和 alive-symptoms 都要读 7 天的 git log。
          # 浅克隆下它们会拿到空历史、静默通过——那是最糟的失效方式。
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 单独一条 sh 脚本：需要判断 gofmt 的输出是否为空，pwsh 下写起来更难读。
      - name: gofmt
        shell: bash
        run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then
            echo "needs gofmt:"
            echo "$bad"
            echo "本地跑 make fmt 后重新提交"
            exit 1
          fi

      - name: build
        run: go build ./...

      # -tags mock 与 Makefile 的 vet / test 目标一致：假数据层
      # （internal/live/mock.go）只在这个构建里存在，不带标签就跳过它的测试。
      - name: vet
        run: go vet -tags mock ./...

      # 官方 action 自己下载官方构建的二进制；不要用 go install——那样拿不到
      # 构建元数据，官方也明说不保证可用（见 .golangci.yml）。
      # 版本跟本地保持一致，判定结果才对得上。
      - name: lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --build-tags mock

      - name: mygo vet
        run: go tool mygo vet .

      - name: test
        run: go test -tags mock ./... -count=1

      # 工程契约里能自动检查的那几条（cmd/alive-gate）。
      # 检查历史的那两条（churn / commits）在工作区里才有意义：CI 是浅克隆、
      # 而且这里评测的是一个已经存在的提交——它们不会误报，直接跳过。
      - name: gate
        run: go run ./cmd/alive-gate

      # 症状账本只写进 job summary，不让构建失败：它回答「这是第几次」，
      # 该不该停手由人判断。把一条启发式判据变成红线，等于让它替你决定。
      - name: symptoms
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          "## 症状账本（doc/STATE.md）" >> $env:GITHUB_STEP_SUMMARY
          "``````" >> $env:GITHUB_STEP_SUMMARY
          go run ./cmd/alive-symptoms -check -out - 2>&1 | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          "``````" >> $env:GITHUB_STEP_SUMMARY
